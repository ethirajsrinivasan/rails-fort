language: ruby
cache: bundler
rvm:
  - 3.0
  - 3.1
  - 3.2
  - 3.3
before_install: gem install bundler
script:
  - bundle exec rake
env:
  - RAILS_VERSION=6.0
  - RAILS_VERSION=6.1
  - RAILS_VERSION=7.0
  - RAILS_VERSION=7.1
  - RAILS_VERSION=8.0
matrix:
  allow_failures:
    - env: RAILS_VERSION=8.0
  fast_finish: true